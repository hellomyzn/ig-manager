name: Daily Instagram Data Fetch

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 UTC 00:00 = JST 09:00
  workflow_dispatch:       # 手動実行（テスト用）

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Create config.ini
        run: |
          cat > src/common/config/config.ini << 'EOF'
          [APP]
          ENV=PROD

          [LOG]
          NAME = prod
          PATH = ./logs/prod.log
          LEVEL = INFO

          [INSTAGRAM]
          ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          USER_ID=${{ secrets.INSTAGRAM_USER_ID }}
          API_VERSION=v25.0
          FACEBOOK_USER_ID=${{ secrets.INSTAGRAM_FACEBOOK_USER_ID }}
          EOF

      - name: Fetch Instagram data
        run: |
          mkdir -p data src/logs
          cd src && DATA_DIR=../data PYTHONPATH=. python main.py

      - name: Commit and push CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "data: daily fetch $(date -u '+%Y-%m-%d')" &&
            git push
          )
